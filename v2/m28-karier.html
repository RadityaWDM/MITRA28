<title>M28 Karier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: hiring-poster job board. Expanded display type echoes M28's "We are Hiring" flyers; navy band header, orange only for the apply action; mobile-first cards, side drawer for detail, bottom sheet for applying. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunk: #eaeef3;
  --ink: #0e2240;
  --fg: #1f2a37;
  --muted: #5e6b7a;
  --line: #d9e0e8;
  --band: #0e2240;
  --band-ink: #ffffff;
  --band-muted: #a9b8cc;
  --cta: #f28c0f;
  --cta-ink: #1a1205;
  --cta-soft: #fdecd6;
  --ok: #0f7b4f;   --ok-soft: #ddf3e8;
  --warn: #a86400; --warn-soft: #fbefd9;
  --bad: #bf3a2b;  --bad-soft: #f9e1dd;
  --info: #1f5fbf; --info-soft: #e2ecfa;
  --wa: #128c4a;   --wa-soft: #dcf5e6;
  --qr: #000000;   --qr-bg: #ffffff;
  --shadow: 0 1px 2px rgba(14,34,64,.06), 0 8px 24px rgba(14,34,64,.08);
  --display: "Archivo", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a1220; --surface: #111c2e; --sunk: #0d1726; --ink: #e9eef6; --fg: #d3dbe6; --muted: #93a1b3; --line: #24334a;
  --band: #0d1a2e; --band-ink: #e9eef6; --band-muted: #8597ae; --cta: #ff9f2e; --cta-ink: #1a1205; --cta-soft: #3a2610;
  --ok: #4cc38a; --ok-soft: #12301f; --warn: #f0b256; --warn-soft: #33260f; --bad: #f08a7c; --bad-soft: #3a1b17; --info: #7fb0f5; --info-soft: #15243d; --wa: #3dd17f; --wa-soft: #10301d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a1220; --surface: #111c2e; --sunk: #0d1726; --ink: #e9eef6; --fg: #d3dbe6; --muted: #93a1b3; --line: #24334a;
  --band: #0d1a2e; --band-ink: #e9eef6; --band-muted: #8597ae; --cta: #ff9f2e; --cta-ink: #1a1205; --cta-soft: #3a2610;
  --ok: #4cc38a; --ok-soft: #12301f; --warn: #f0b256; --warn-soft: #33260f; --bad: #f08a7c; --bad-soft: #3a1b17; --info: #7fb0f5; --info-soft: #15243d; --wa: #3dd17f; --wa-soft: #10301d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
h1, h2, h3, h4 { margin: 0; color: var(--ink); text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cta); outline-offset: 2px; }
svg { flex: none; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.disp { font-family: var(--display); font-stretch: 118%; font-weight: 800; letter-spacing: -.01em; }

/* Header band */
.band { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; }
.band .wrap { display: flex; align-items: center; gap: 18px; min-height: 60px; flex-wrap: wrap; padding-block: 6px; }
.mark { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 18px; letter-spacing: .01em; }
.mark i { width: 34px; height: 34px; border-radius: 8px; background: var(--band-ink); color: var(--band); display: grid; place-items: center; font-style: normal; font-size: 14px; position: relative; }
.mark i::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 3px; background: var(--cta); }
.mark small { display: block; font-family: var(--body); font-stretch: 100%; font-weight: 500; font-size: 11.5px; color: var(--band-muted); letter-spacing: 0; }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; }
.tab { border: 0; background: transparent; color: var(--band-muted); padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--band-ink); background: rgba(255,255,255,.08); }
.tab[aria-current="true"] { color: var(--band-ink); background: rgba(255,255,255,.14); }
.tab .hr { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; background: var(--cta); color: var(--cta-ink); }
.aibar { font-size: 12.5px; }
.aibar .wrap { display: flex; gap: 8px; align-items: center; padding-block: 7px; flex-wrap: wrap; }
.aibar.on { background: var(--info-soft); color: var(--fg); }
.aibar.off { background: var(--warn-soft); color: var(--fg); }
.aibar b { color: var(--ink); }

/* Buttons */
.btn { border: 1px solid transparent; border-radius: 10px; padding: 9px 16px; font-weight: 700; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; transition: filter .15s, background .15s; text-decoration: none; }
.btn:hover { filter: brightness(1.05); }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.btn.cta { background: var(--cta); color: var(--cta-ink); }
.btn.ink { background: var(--ink); color: var(--surface); }
.btn.line { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.line:hover { background: var(--sunk); }
.btn.wa { background: var(--wa); color: #ffffff; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13.5px; border-radius: 8px; }
.link { border: 0; background: none; padding: 0; color: var(--info); font-weight: 600; font-size: inherit; }
.link:hover { text-decoration: underline; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--sunk); color: var(--fg); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.cta { background: var(--cta-soft); color: var(--ink); }
.pill.wa { background: var(--wa-soft); color: var(--wa); }

/* Jobs view */
.hero { padding-block: 28px 18px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: end; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero h1 { font-family: var(--display); font-stretch: 122%; font-weight: 800; font-size: clamp(30px, 4.6vw, 52px); letter-spacing: -.015em; margin-top: 8px; }
.hero h1 em { font-style: normal; color: var(--cta); }
.hero .sub { margin-top: 10px; color: var(--muted); max-width: 58ch; }
.seal { border: 2px solid var(--ink); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; background: var(--surface); position: relative; }
.seal b { font-family: var(--display); font-stretch: 118%; font-size: 20px; color: var(--ink); }
.seal p { font-size: 13.5px; color: var(--muted); }
.seal cite { font-style: normal; font-size: 12px; color: var(--muted); }
.searchrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-bottom: 14px; }
.search { flex: 1 1 320px; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; min-height: 48px; min-width: 0; }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 15.5px; }
.search svg { color: var(--muted); }
.dd { position: relative; }
.ddbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; color: var(--fg); }
.ddbtn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
.ddpop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 25; width: min(300px, calc(100vw - 32px)); background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--line), var(--shadow); }
.ddpop.right { left: auto; right: 0; }
.ddlist { padding: 6px 0; max-height: 330px; overflow: auto; }
.ddopt { display: flex; align-items: center; gap: 12px; padding: 9px 16px; font-size: 14px; cursor: pointer; }
.ddopt:hover { background: var(--sunk); }
.ddopt input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); }
.ddopt .n { margin-left: auto; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ddopt.zero { color: var(--muted); }
.ddfoot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; justify-content: flex-end; gap: 8px; }
.stats { display: flex; gap: 6px 22px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); padding-bottom: 14px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; padding-bottom: 48px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; align-content: start; text-align: left; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--ink); box-shadow: var(--shadow); }
.card-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.cat { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.cat .ci { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--sunk); color: var(--ink); }
.cat .ci svg { width: 16px; height: 16px; }
.card h3 { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 21px; letter-spacing: -.005em; }
.meta { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.meta span { display: inline-flex; gap: 5px; align-items: center; }
.meta svg { width: 15px; height: 15px; }
.client { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; grid-column: 1 / -1; }

/* Overlays */
.scrim { position: fixed; inset: 0; background: rgba(5,12,24,.55); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); z-index: 41; overflow: auto; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: min(640px, 100%); max-height: min(92vh, 100%); background: var(--surface); z-index: 41; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 700px) { .sheet { bottom: auto; top: 50%; transform: translate(-50%, -50%); border-radius: 18px; max-height: 90vh; } }
@media (prefers-reduced-motion: no-preference) { .drawer.anim { animation: slidein .2s ease-out; } .sheet.anim { animation: rise .2s ease-out; } @keyframes slidein { from { transform: translateX(24px); opacity: .6; } } @keyframes rise { from { opacity: .6; } } }
.x { border: 0; background: var(--sunk); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); flex: none; }
.x:hover { background: var(--line); }
.dh { padding: 18px 20px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line); }
.dh h2 { font-family: var(--display); font-stretch: 116%; font-weight: 800; font-size: 26px; }
.db { padding: 18px 20px 28px; display: grid; gap: 20px; }
.sec h4 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.sec ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fact { background: var(--sunk); border-radius: 10px; padding: 10px 12px; }
.fact span { display: block; font-size: 12px; color: var(--muted); }
.fact b { color: var(--ink); font-size: 14.5px; }
.applybar { display: grid; gap: 8px; }
.qrbox { display: flex; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.qr { background: var(--qr-bg); padding: 6px; border-radius: 8px; width: 112px; height: 112px; flex: none; display: grid; place-items: center; }
.qr img, .qr canvas { width: 100px !important; height: 100px !important; }
.qrbox p { font-size: 13.5px; }
.copyrow { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.copyrow code { font-family: var(--mono); font-size: 12px; background: var(--sunk); padding: 4px 8px; border-radius: 6px; overflow-wrap: anywhere; }

/* Apply sheet */
.sh { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.sh-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.sh-top h2 { font-family: var(--display); font-stretch: 114%; font-weight: 800; font-size: 22px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stp { display: grid; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.stp i { height: 5px; border-radius: 5px; background: var(--sunk); }
.stp.on { color: var(--ink); }
.stp.on i { background: var(--cta); }
.sb { padding: 18px 20px; overflow: auto; display: grid; gap: 16px; align-content: start; }
.sf { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.sf .left { margin-right: auto; font-size: 12.5px; color: var(--muted); }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 22px 16px; display: grid; gap: 8px; justify-items: center; text-align: center; background: var(--sunk); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--cta); background: var(--cta-soft); }
.drop b { font-size: 16px; color: var(--ink); }
.drop .fmt { font-size: 12.5px; color: var(--muted); }
.samples { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.chiprow { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.demo { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.demo .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.reading { display: flex; gap: 12px; align-items: flex-start; border-radius: 12px; padding: 12px 14px; background: var(--info-soft); }
.reading.err { background: var(--bad-soft); }
.reading.done { background: var(--ok-soft); }
.reading b { color: var(--ink); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--info); border-right-color: transparent; flex: none; margin-top: 2px; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.fgrid .span2 { grid-column: 1 / -1; }
@media (max-width: 560px) { .fgrid { grid-template-columns: 1fr; } }
.field { display: grid; gap: 5px; min-width: 0; }
fieldset.field { border: 0; padding: 0; margin: 0; }
.field label, .field legend { font-size: 13.5px; font-weight: 600; color: var(--fg); padding: 0; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.field textarea { min-height: 76px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 0; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.field .ai { font-size: 11.5px; font-weight: 600; color: var(--info); }
.field [aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.ferr { font-size: 12.5px; font-weight: 600; color: var(--bad); }
.req { color: var(--bad); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg span { display: inline-flex; min-height: 38px; align-items: center; padding: 4px 18px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--surface); }
.seg input:checked + span { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 2px solid var(--cta); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--ink); flex: none; }
.free { display: flex; gap: 10px; align-items: center; border-radius: 12px; padding: 10px 14px; background: var(--ok-soft); color: var(--fg); font-size: 13.5px; }
.free svg { color: var(--ok); }
.ticket { border: 2px solid var(--ink); border-radius: 16px; padding: 18px; display: grid; gap: 6px; justify-items: center; text-align: center; position: relative; overflow: hidden; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); transform: translateY(-50%); }
.ticket::before { left: -13px; } .ticket::after { right: -13px; }
.ticket .no { font-family: var(--mono); font-size: 24px; font-weight: 500; color: var(--ink); letter-spacing: .04em; }
.wa-bubble { background: var(--wa-soft); border-radius: 12px 12px 12px 4px; padding: 10px 12px; font-size: 14px; display: grid; gap: 4px; max-width: 520px; }
.wa-bubble .wh { font-size: 12px; font-weight: 700; color: var(--wa); display: flex; gap: 6px; align-items: center; }
.wa-bubble time { font-size: 11.5px; color: var(--muted); justify-self: end; }
.suggest { display: grid; gap: 8px; }
.sg { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; background: var(--surface); width: 100%; }
.sg:hover { border-color: var(--ink); }
.sg b { color: var(--ink); }
.sg .muted { font-size: 13px; }

/* WhatsApp chat */
.chat { background: var(--sunk); padding: 14px; display: grid; gap: 8px; align-content: start; overflow: auto; flex: 1; min-height: 280px; }
.msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 14.5px; white-space: pre-line; }
.msg.bot { background: var(--surface); border-top-left-radius: 4px; justify-self: start; }
.msg.me { background: var(--wa-soft); border-top-right-radius: 4px; justify-self: end; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--surface); }
.composer input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; background: var(--surface); }
.wahead { display: flex; gap: 10px; align-items: center; padding: 12px 16px; background: var(--wa); color: #ffffff; border-radius: 18px 18px 0 0; }
.wahead b { display: block; font-size: 15px; }
.wahead small { opacity: .85; font-size: 12px; }
.wahead .x { background: rgba(255,255,255,.2); color: #ffffff; margin-left: auto; }
@media (min-width: 700px) { .wahead { border-radius: 18px 18px 0 0; } }

/* Track */
.page-h { padding-block: 26px 16px; display: grid; gap: 6px; }
.page-h h1 { font-family: var(--display); font-stretch: 118%; font-weight: 800; font-size: clamp(26px, 3.6vw, 38px); }

function simScreen(app) {
  const j = jobById(app.job), p = app.profile || {};
  const vals = o => o == null ? "" : typeof o === "object" ? Object.values(o).map(vals).join(" ") : String(o);
  const text = (vals(p) + " " + (app.cvText || "")).toLowerCase();
  const has = k => new RegExp("(^|[^a-z0-9])" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "($|[^a-z0-9])").test(text);
  const hay = { includes: has };
  const crit = [];
  const have = eduRank(p.pendidikan && p.pendidikan.jenjang), need = eduRank(j.edu);
  crit.push({ syarat: `Pendidikan minimal ${j.edu}`, status: have ? (have >= need ? "terpenuhi" : "tidak") : "tidak_jelas", bukti: have ? `Pendidikan: ${p.pendidikan.jenjang}${p.pendidikan.jurusan ? " " + p.pendidikan.jurusan : ""}` : "Tidak tertulis" });
  j.req.forEach(r => { const hit = r.kw.find(k => hay.includes(k)); crit.push({ syarat: r.t, status: hit ? "terpenuhi" : "tidak_jelas", bukti: hit ? `Ada kata "${hit}" di CV/profil` : "Tidak ditemukan di CV" }); });
  j.ko.forEach((k, i) => { const a = app.answers[i]; crit.push({ syarat: k.q, status: a === k.must ? "terpenuhi" : a ? "tidak" : "tidak_jelas", bukti: a ? `Jawaban pelamar: ${a}` : "Belum dijawab" }); });
  const pts = crit.reduce((s, c) => s + (c.status === "terpenuhi" ? 1 : c.status === "tidak_jelas" ? .35 : 0), 0);
  let skor = Math.round(pts / crit.length * 100);
  if (crit.some(c => c.status === "tidak")) skor = Math.min(skor, 45);
  const others = JOBS.filter(x => x.id !== j.id).map(x => ({ x, reqHit: x.req.filter(r => r.kw.some(has)).length, hits: x.req.flatMap(r => r.kw).filter(has) })).filter(o => o.reqHit >= 2 && eduRank(p.pendidikan && p.pendidikan.jenjang) >= eduRank(o.x.edu)).sort((a, b) => b.reqHit - a.reqHit || b.hits.length - a.hits.length).slice(0, 3);
  return {
    skor, rekomendasi: skor >= 75 ? "Lanjut interview" : skor >= 50 ? "Pertimbangkan" : "Belum cocok",
    ringkas: `${crit.filter(c => c.status === "terpenuhi").length} dari ${crit.length} syarat terlihat terpenuhi${crit.some(c => c.status === "tidak") ? ", ada syarat wajib yang tidak terpenuhi" : ""}.`,
    kriteria: crit,

/* ===== Onboarding & kontrak ===== */
const DOCS = {
  ktp: { l: "KTP", wajib: true }, kk: { l: "Kartu Keluarga", wajib: true }, rek: { l: "Buku tabungan / rekening bank", wajib: true },
  ijazah: { l: "Ijazah terakhir", wajib: true }, foto: { l: "Pas foto 3x4", wajib: true },
  npwp: { l: "NPWP", wajib: false }, bpjs: { l: "Kartu BPJS Kesehatan (bila sudah punya)", wajib: false },
  skck: { l: "SKCK", wajib: true }, sehat: { l: "Surat keterangan sehat", wajib: true },
  kta: { l: "KTA Satpam", wajib: true }, gada: { l: "Sertifikat Gada Pratama", wajib: true }, sima: { l: "SIM A", wajib: true },
};
function docsFor(j) {
  const k = ["ktp", "kk", "rek", "ijazah", "foto", "npwp", "bpjs"];
  if (j.cat === "facility") k.push("skck", "sehat");
  if (j.cat === "fnb") k.push("sehat");
  if (/^SEC/.test(j.id)) k.push("kta", "gada");
  if (/^DPA/.test(j.id)) k.push("sima", "skck");
  return [...new Set(k)];
}
const DOC_ST = { belum: ["Belum ada", ""], unggah: ["Menunggu verifikasi", "warn"], ok: ["Terverifikasi", "ok"], tolak: ["Perlu diunggah ulang", "bad"] };
const DOC_REJ = ["Foto buram", "Dokumen terpotong", "Bukan dokumen yang diminta", "Sudah kedaluwarsa"];
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayY = () => ymd(new Date());
const daysTo = iso => Math.round((new Date(iso + "T00:00") - new Date(todayY() + "T00:00")) / DAY);
const addMonths = (iso, m) => { const d = new Date(iso + "T00:00"); d.setMonth(d.getMonth() + m); d.setDate(d.getDate() - 1); return ymd(d); };
const addDays = (iso, n) => { const d = new Date(iso + "T00:00"); d.setDate(d.getDate() + n); return ymd(d); };
let BLOBS = {}, DOCAI = {}, DOCREJ = null, OPEN_ONB = null, EMP = null;
const allContracts = () => apps.flatMap(a => a.onb ? (a.onb.history || []).concat(a.onb.contract ? [a.onb.contract] : []) : []);
function newContract(a, mulai, durasi, ke) {
  const j = jobById(a.job);
  return { no: `PKWT/M28/${mulai.slice(0, 4)}/${String(41 + allContracts().length).padStart(3, "0")}`, mulai, durasi, akhir: addMonths(mulai, durasi), upah: a.place ? a.place.upah : "", jabatan: j.t, lokasi: j.loc, klien: clientOf(j).nama, ke: ke || 1, status: "draf", at: new Date().toISOString() };
}
const SEED_ONB = {
  "Yoga Firmansyah": a => { Object.keys(a.onb.docs).forEach(k => a.onb.docs[k] = { st: k === "bpjs" ? "unggah" : "ok", file: `${k.toUpperCase()}_Yoga.jpg` }); Object.assign(a.onb.contract, { status: "ditandatangani", signName: "Yoga Firmansyah", signedAt: a.place.at }); },
  "Asep Sunandar": a => { Object.keys(a.onb.docs).forEach(k => a.onb.docs[k] = { st: k === "npwp" ? "belum" : "ok", file: k === "npwp" ? "" : `${k.toUpperCase()}_Asep.jpg` }); a.onb.contract = newContract(a, a.place.mulai, 12); Object.assign(a.onb.contract, { status: "ditandatangani", signName: "Asep Sunandar", signedAt: a.place.at }); },
  "Lina Herlina": a => { const d = a.onb.docs; d.ktp = { st: "ok", file: "KTP_Lina.jpg" }; d.kk = { st: "ok", file: "KK_Lina.jpg" }; d.foto = { st: "ok", file: "Foto_Lina.jpg" }; d.rek = { st: "unggah", file: "Rekening_Lina.jpg" }; d.skck = { st: "tolak", file: "SKCK_Lina.jpg", note: "Foto buram" }; Object.assign(a.onb.contract, { status: "dikirim", sentAt: a.place.at }); },
  "Dedi Kurniawan": a => { Object.keys(a.onb.docs).forEach(k => a.onb.docs[k] = { st: k === "bpjs" ? "belum" : "ok", file: k === "bpjs" ? "" : `${k.toUpperCase()}_Dedi.jpg` }); a.onb.contract = newContract(a, a.place.mulai, 12); Object.assign(a.onb.contract, { status: "ditandatangani", signName: "Dedi Kurniawan", signedAt: a.place.at }); },
};
function ensureOnb(a, announce) {
  if (a.stage !== "ditempatkan" || a.onb) return;
  const j = jobById(a.job);
  a.onb = { docs: Object.fromEntries(docsFor(j).map(k => [k, { st: "belum" }])), contract: null, history: [] };
  a.onb.contract = newContract(a, a.place ? a.place.mulai : todayY(), 6);
  const seed = a.seed && SEED_ONB[a.profile.nama];
  if (seed) seed(a);
  if (announce) { const at = new Date().toISOString(); a.msgs.push({ at, k: "dokumen", text: waText("dokumen", a) }); a.log.push({ at, t: "Link dokumen onboarding dikirim ke karyawan" }); }
}
function docProg(a) {
  const ks = Object.keys(a.onb.docs), w = ks.filter(k => DOCS[k].wajib);
  return { w: w.length, ok: w.filter(k => a.onb.docs[k].st === "ok").length, pend: ks.filter(k => a.onb.docs[k].st === "unggah").length, rej: ks.filter(k => a.onb.docs[k].st === "tolak").length };
}
function cState(c) {
  if (!c) return ["Belum ada", ""];
  if (c.status === "draf") return ["Draf", ""];
  if (c.status === "dikirim") return ["Menunggu tanda tangan", "warn"];
  if (c.status === "selesai") return ["Tidak diperpanjang", ""];
  if (c.status === "diperpanjang") return ["Diperpanjang", "info"];
  const dEnd = daysTo(c.akhir), dStart = daysTo(c.mulai);
  if (dEnd < 0) return ["Berakhir", "bad"];
  if (dStart > 0) return [`Ditandatangani, mulai ${fmtD(c.mulai)}`, "info"];
  if (dEnd <= 30) return [`Berakhir ${dEnd} hari lagi`, "bad"];

}
const signed = c => c && c.status === "ditandatangani";
const ready = a => { const p = docProg(a); return p.ok === p.w && signed(a.onb.contract); };
const placedApps = () => apps.filter(a => a.stage === "ditempatkan").map(a => { norm(a); ensureOnb(a); return a; });
const startText = iso => { const d = daysTo(iso); return d > 0 ? `mulai ${d} hari lagi` : d === 0 ? "mulai hari ini" : `sudah ${-d} hari bekerja`; };

    <div class="sh clienthead"><div class="sh-top"><div><span class="eyebrow">Portal karyawan M28 · simulasi</span><h2 id="et">${signMode ? "Tanda tangan kontrak" : `Halo ${esc(first)}, selamat bergabung`}</h2><span class="muted small">${esc(j.t)} di ${esc(j.klien)}, ${j.loc}${a.place ? ` · mulai ${fmtD(a.place.mulai)}` : ""}</span></div><button class="x" data-close aria-label="Tutup">${I.close}</button></div></div>
    <div class="sb">${body}</div></section>`;
  const sf = document.getElementById("signform");
  if (sf) sf.addEventListener("submit", e => {
    e.preventDefault();
    const nm = document.getElementById("sg-name").value.trim(), err = document.getElementById("sg-err");
    if (!document.getElementById("sg-ok").checked) { err.textContent = "Centang pernyataan bahwa Anda sudah membaca kontrak."; err.hidden = false; return; }
    if (nm.toLowerCase().replace(/\s+/g, " ") !== a.profile.nama.toLowerCase().replace(/\s+/g, " ")) { err.textContent = `Ketik nama lengkap persis seperti di data: ${a.profile.nama}.`; err.hidden = false; return; }
    Object.assign(c, { status: "ditandatangani", signName: nm, signedAt: new Date().toISOString() });
    a.log.push({ at: c.signedAt, t: `Kontrak ${c.no} ditandatangani karyawan` }); save(); render(); empView(no);
    toast("Kontrak ditandatangani. Salinannya dikirim ke WhatsApp karyawan (simulasi).");
  });
  lay.querySelector(".x").focus();
}

/* ===== Events ===== */
document.addEventListener("click", e => {
  if (S.dd && !e.target.closest(".dd")) { S.dd = null; render(); }
  const t = e.target.closest("[data-view],[data-hrpage],[data-dd],[data-ddreset],[data-ddapply],[data-clear],[data-job],[data-close],[data-apply],[data-apply-qr],[data-wa],[data-copy],[data-sample],[data-nocv],[data-src],[data-next],[data-prev],[data-submit],[data-waq],[data-gotrack],[data-gohr],[data-sel],[data-hrtab],[data-mv],[data-sched],[data-score],[data-savescore],[data-aiq],[data-act],[data-extra],[data-rescreen],[data-reseed],[data-person],[data-offer],[data-offerbtn],[data-gosel],[data-aiclear],[data-card],[data-client],[data-sendsl],[data-clientview],[data-cresp],[data-crej],[data-newjob],[data-pjobgo],[data-copytext],[data-onb],[data-remind],[data-empview],[data-csign],[data-docv],[data-docrej],[data-docai],[data-contract],[data-csave],[data-csend],[data-renew],[data-cend]");
  if (!t) return;
  const d = t.dataset;
  if (d.client) return openClient(d.client);
  if (d.sendsl) { sendShortlist(d.sendsl); render(); return; }
  if (d.clientview) return clientView(d.clientview);
  if (d.crej) { CV_REJ = CV_REJ === d.crej ? null : d.crej; const a = apps.find(x => x.no === d.crej); if (a) clientView(jobById(a.job).client); return; }
  if (d.cresp) { const [no, k, ...r] = d.cresp.split(":"); return clientResp(no, k, r.join(":")); }
  if ("newjob" in d) return openNewJob(d.newjob);
  if (d.pjobgo) { lay.innerHTML = ""; S.view = "hr"; S.hrPage = "pipeline"; S.pJob = d.pjobgo; S.pCity = "ALL"; render(); window.scrollTo(0, 0); return; }
  if (d.copytext) return copy(d.copytext, "Pesan disalin");
  if (d.onb) return openOnb(d.onb);
  if (d.remind) { remind(d.remind); if (OPEN_ONB) openOnb(OPEN_ONB); else render(); return; }
  if (d.empview) return empView(d.empview);
  if (d.csign) return empView(d.csign, true);
  if (d.docv) return docVerify(d.docv, true);
  if (d.docrej) { const parts = d.docrej.split("|"); if (parts.length >= 3) return docVerify(parts[0] + "|" + parts[1], false, parts.slice(2).join("|")); DOCREJ = DOCREJ === d.docrej ? null : d.docrej; return openOnb(parts[0]); }
  if (d.docai) return aiDoc(d.docai);
  if (d.contract) return openContract(d.contract);
  if (d.csave) { const a = apps.find(x => x.no === d.csave); if (a) { readContractForm(a); save(); toast("Draf kontrak disimpan."); openContract(d.csave); } return; }
  if (d.csend) return contractSend(d.csend);
  if (d.renew) return contractRenew(d.renew);
  if (d.cend) return contractEnd(d.cend);
  if (d.view) { S.view = d.view; lay.innerHTML = ""; render(); window.scrollTo(0, 0); }
  else if (d.hrpage) { S.hrPage = d.hrpage; lay.innerHTML = ""; render(); }
  else if (d.dd) { if (d.dd === "imp" && S.dd !== "imp") { S.dd = "imp"; S.pend = "Jobstreet"; } else { S.dd = S.dd === d.dd ? null : d.dd; S.pend = d.dd === "cat" ? S.cat : S.city; } render(); }
  else if ("ddreset" in d) { S.pend = d.ddreset; render(); }
  else if (d.ddapply) { const k = d.ddapply; S.dd = null; if (k === "imp") importFrom(S.pend); else { S[k] = S.pend; render(); } }
  else if ("clear" in d) { Object.assign(S, { q: "", cat: "ALL", city: "ALL" }); render(); }
  else if ("close" in d) { lay.innerHTML = ""; A = null; W = null; SC = null; OPEN_PERSON = null; OPEN_CLIENT = null; CV_REJ = null; OPEN_ONB = null; EMP = null; DOCREJ = null; }
  else if (d.apply) openApply(d.apply, "Website");
  else if (d.applyQr) openApply(d.applyQr, "QR poster");
  else if (d.wa) openWA(d.wa);
  else if (d.job) openJob(d.job);
  else if (d.copy) copy("https://" + d.copy, "Link lowongan disalin");
  else if (d.sample && A) { const c = SAMPLE_CVS.find(x => x.key === d.sample); takeFile({ name: c.file }, c); }
  else if ("nocv" in d && A) { A.cv = null; A.read = "idle"; A.step = 2; drawApply(); }
  else if (d.src && A) { A.src = d.src; drawApply(); }
  else if ("next" in d && A) { A.err = validate(); if (Object.keys(A.err).length) return drawApply(); A.step++; drawApply(); }
  else if ("prev" in d && A) { A.err = {}; A.step--; drawApply(); }
  else if ("submit" in d && A) { A.err = validate(); if (Object.keys(A.err).length) return drawApply(); submitApply(); }
  else if (d.waq && W) { if (d.waq.startsWith("Lewati")) { W.msgs.push({ who: "me", t: d.waq }); waFinish(); } else waAnswer(d.waq); }
  else if (d.gotrack) { lay.innerHTML = ""; S.view = "track"; S.trackQ = d.gotrack; render(); window.scrollTo(0, 0); }
  else if (d.gohr || d.gosel) { lay.innerHTML = ""; S.view = "hr"; S.hrPage = "screening"; S.hrSel = d.gohr || d.gosel; S.hrTab = "ALL"; S.hrJob = "ALL"; render(); window.scrollTo(0, 0); }
  else if (d.sel) { S.hrSel = d.sel; render(); if (window.matchMedia("(max-width: 980px)").matches) document.querySelector(".desk .panel:last-child")?.scrollIntoView({ behavior: "smooth" }); }
  else if (d.hrtab) { S.hrTab = d.hrtab; render(); }
  else if (d.mv) { const [no, k] = d.mv.split(":"); const a = apps.find(x => x.no === no); if (a) { if (!goStage(a, k)) return; render(); if (OPEN_CLIENT) openClient(OPEN_CLIENT); if (OPEN_PERSON) openPerson(OPEN_PERSON); toast(`${a.profile.nama.split(" ")[0]} dipindah ke ${stageL(k)}. Pesan WhatsApp disiapkan.`); } }
  else if (d.sched) openSchedule(d.sched);
  else if (d.score) openScore(d.score);
  else if ("savescore" in d && SC) saveScore();
  else if ("aiq" in d && SC && !SC.qBusy) aiQuestions();
  else if (d.act) doNext(d.act);
  else if (d.extra) { const [no, id] = d.extra.split(":"); const a = apps.find(x => x.no === no); if (a) { const i = a.extra.indexOf(id); if (i < 0) { a.extra.push(id); toast(`${a.profile.nama.split(" ")[0]} ditandai untuk ${jobById(id).t}`); } else a.extra.splice(i, 1); save(); render(); } }
  else if (d.rescreen) { const a = apps.find(x => x.no === d.rescreen); if (a) { a.screening = "pending"; render(); runScreen(a); } }
  else if ("reseed" in d) { apps = seedApps(); save(); S.hrSel = null; S.aiRes = null; render(); toast("Data contoh dikembalikan"); }
  else if (d.person) openPerson(d.person);
  else if (d.offer) { const [key, id] = d.offer.split("|"); offer(key, id); render(); }
  else if (d.offerbtn) { const sel = document.getElementById("offer-job"); offer(d.offerbtn, sel.value); render(); openPerson(d.offerbtn); }
  else if ("aiclear" in d) { S.aiRes = null; S.aiQ = ""; render(); }
  else if (d.card && !e.target.closest("button")) { const a = apps.find(x => x.no === d.card); if (a) openPerson(keyOf(a)); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.card) { const a = apps.find(x => x.no === e.target.dataset.card); if (a) openPerson(keyOf(a)); return; }
  if (e.key !== "Escape") return;
  if (lay.innerHTML) { lay.innerHTML = ""; A = null; W = null; SC = null; OPEN_PERSON = null; OPEN_CLIENT = null; CV_REJ = null; OPEN_ONB = null; EMP = null; DOCREJ = null; } else if (S.dd) { S.dd = null; render(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "q" || el.id === "tq2") { const k = el.id === "q" ? "q" : "tq"; S[k] = el.value; const pos = el.selectionStart; render(); const n = document.getElementById(el.id); n.focus(); n.setSelectionRange(pos, pos); }
  else if (el.dataset.f && A) {
    const k = el.dataset.f, p = A.profile;
    if (k === "jenjang") p.pendidikan.jenjang = el.value; else if (k === "usia") p.usia = el.value ? Number(el.value) : null; else if (k === "peng") A.peng = el.value; else if (k === "skill") A.skill = el.value; else p[k] = el.value;
    if (A.err[k]) { delete A.err[k]; el.removeAttribute("aria-invalid"); const fe = el.parentElement.querySelector(".ferr"); fe && fe.remove(); }
  }
  else if (el.dataset.pnote) { PMETA[el.dataset.pnote] = Object.assign(PMETA[el.dataset.pnote] || {}, { note: el.value }); saveMeta(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.name && el.name.startsWith("dd-")) S.pend = el.value;
  else if (el.id === "cvf" && el.files[0] && A) takeFile(el.files[0]);
  else if (el.dataset.ko != null && A) { A.answers[+el.dataset.ko] = el.value; const k = "ko" + el.dataset.ko; if (A.err[k]) { delete A.err[k]; const fe = el.closest("fieldset").querySelector(".ferr"); fe && fe.remove(); } }
  else if ("agree" in el.dataset && A) { A.agree = el.checked; if (A.err.agree) { delete A.err.agree; el.removeAttribute("aria-invalid"); } }
  else if (el.id === "hrjob") { S.hrJob = el.value; render(); }
  else if (el.id === "pjob" || el.id === "pcity") { S[el.id === "pjob" ? "pJob" : "pCity"] = el.value; render(); }
  else if (el.id === "tcity" || el.id === "tstat") { S[el.id === "tcity" ? "tCity" : "tStat"] = el.value; render(); }
  else if (el.name && el.name.startsWith("sc-") && SC) { if (el.name === "sc-rec") SC.rec = el.value; else SC.r[+el.name.slice(3)] = +el.value; SC.err = ""; }
  else if (el.dataset.docup) docUpload(el.dataset.docup, el.files[0]);
  else if (el.id === "plclient") { S.plClient = el.value; render(); }
  else if (el.dataset.stageOf) { const a = apps.find(x => x.no === el.dataset.stageOf); if (!a) return; const k = el.value; if (!goStage(a, k)) return; render(); if (OPEN_PERSON) openPerson(OPEN_PERSON); toast(`Dipindah ke ${stageL(k)}`); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "trackform") { e.preventDefault(); S.trackQ = document.getElementById("tq").value; render(); }
  else if (e.target.id === "aiform") { e.preventDefault(); talentSearch(document.getElementById("aiq").value); }
});
/* Drag & drop kartu pipeline */
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest("[data-card]"); if (!c) return; e.dataTransfer.setData("text/plain", c.dataset.card); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); });
document.addEventListener("dragend", e => { document.querySelectorAll(".dragging,.over").forEach(x => x.classList.remove("dragging", "over")); });
document.addEventListener("dragover", e => { const z = e.target.closest && e.target.closest("[data-drop]"); if (!z) return; e.preventDefault(); document.querySelectorAll(".over").forEach(x => x !== z && x.classList.remove("over")); z.classList.add("over"); });
document.addEventListener("drop", e => { const z = e.target.closest && e.target.closest("[data-drop]"); if (!z) return; e.preventDefault(); z.classList.remove("over"); const no = e.dataTransfer.getData("text/plain"); if (no) dropTo(no, z.dataset.drop); });
render();
</script>
